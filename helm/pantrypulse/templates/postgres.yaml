{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pp.dbSecret" . }}
  labels:
    {{- include "pp.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgres.auth.password (or database.existingSecret) is required" .Values.postgres.auth.password | quote }}
---
{{- end }}
{{- if .Values.postgres.enabled }}
{{- $c := dict "component" "postgres" "root" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pp.name" . }}-postgres
  labels:
    {{- include "pp.labels" . | nindent 4 }}
    {{- include "pp.selector" $c | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "pp.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "pp.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pp.labels" . | nindent 8 }}
        {{- include "pp.selector" $c | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.database.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "pp.dbSecret" . }}, key: password }
            # A sub-directory avoids initdb failing on a volume's lost+found.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "pp.restrictedContainer" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  # apiVersion/kind/volumeMode are the API server defaults; spelling them out
  # keeps Argo CD from reporting the StatefulSet as permanently OutOfSync.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pp.name" . }}-postgres
  labels:
    {{- include "pp.labels" . | nindent 4 }}
    {{- include "pp.selector" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pp.selector" $c | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
