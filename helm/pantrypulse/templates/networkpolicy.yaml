{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
# Only the API pods and the migration Job may open connections to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pp.name" . }}-postgres
  labels:
    {{- include "pp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pp.selector" (dict "component" "postgres" "root" .) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pp.selector" (dict "component" "backend" "root" .) | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: migrations
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: 5432 }
{{- end }}
