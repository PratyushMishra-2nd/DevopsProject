# Free-tier AWS profile: single-node k3s on a t3.micro (1 GiB RAM + 2 GiB swap)
# created by terraform/ec2-k3s/. k3s bundles Traefik (ingress class "traefik",
# published on the node's :80), the local-path StorageClass and metrics-server,
# so no extra add-ons are needed. Replicas and requests are trimmed to fit.
backend:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

frontend:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 75

postgres:
  persistence:
    storageClass: local-path
    size: 2Gi
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

# One replica per component on one node: a PDB with minAvailable=1 would only
# block node maintenance without protecting anything.
podDisruptionBudget:
  enabled: false

ingress:
  enabled: true
  host: ""          # empty: answer on the instance's public IP

serviceMonitor:
  enabled: false    # no Prometheus on a 1 GiB node
