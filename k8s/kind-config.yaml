# Local cluster used for the live demo and the CI deploy job.
# Host ports 8088/8443 (80/443 are often taken by Docker Desktop or IIS on
# Windows). Open http://pantrypulse.127.0.0.1.nip.io:8088 after install.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pantrypulse
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
