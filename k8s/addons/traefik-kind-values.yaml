# Traefik v3 as the Ingress controller on the local kind cluster.
#   helm upgrade --install traefik traefik/traefik --version 41.7.1 \
#     -n traefik --create-namespace -f k8s/addons/traefik-kind-values.yaml
# ingress-nginx was archived upstream in March 2026 (no further security
# fixes), see docs/adr/0004-traefik-ingress-controller.md.
deployment:
  replicas: 1
# hostPorts can be held by one pod per node: replace the old pod first,
# otherwise the surge pod stays Pending ("didn't have free ports").
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
# Run on the node that kind maps host ports 80/443 to.
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
service:
  type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
    # Publish an address in Ingress status (the host port mapping on
    # 127.0.0.1); Argo CD reports Ingresses without one as Progressing.
    ingressEndpoint:
      ip: 127.0.0.1
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: false
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
