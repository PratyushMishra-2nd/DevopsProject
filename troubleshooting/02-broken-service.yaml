# LAB 2 - Service with no endpoints
# The pods are healthy, but the Service selector has a typo (app: lab-web vs
# app: lab-webb), so it matches nothing and every request through it fails.
# Diagnose: kubectl -n pp-lab get endpointslices -l kubernetes.io/service-name=lab-web
#           kubectl -n pp-lab get pods --show-labels
# Fix: correct the selector (kubectl -n pp-lab patch svc lab-web ...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
  namespace: pp-lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: lab-web }
  template:
    metadata:
      labels: { app: lab-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/pratyushmishra-2nd/pantrypulse-frontend:__SHA__
          ports: [{ name: http, containerPort: 8080 }]
          env: [{ name: BACKEND_UPSTREAM, value: "127.0.0.1:8000" }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: lab-web
  namespace: pp-lab
spec:
  selector:
    app: lab-webb   # <-- typo: no pod has this label
  ports:
    - { name: http, port: 80, targetPort: http }
