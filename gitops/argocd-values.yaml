# Argo CD for the local kind cluster.
#   helm upgrade --install argocd argo/argo-cd --version 10.10.3 -n argocd \
#     --create-namespace -f gitops/argocd-values.yaml
global:
  domain: argocd.127.0.0.1.nip.io
configs:
  params:
    # TLS ends at the Ingress controller on this local cluster.
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
server:
  ingress:
    enabled: true
    ingressClassName: traefik
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
