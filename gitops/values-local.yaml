# Desired state of the local (kind) environment, reconciled by Argo CD.
# Change the tags only with scripts/promote.sh <sha>: it refuses builds that
# are not in GHCR, so only images that passed CI and the Trivy gate are deployed.
backend:
  image:
    tag: "8be415d7e29164a997390aad36d32623c3548548"

frontend:
  image:
    tag: "8be415d7e29164a997390aad36d32623c3548548"

# Password lives in a Secret created outside Git (scripts/install-argocd.sh).
database:
  existingSecret: pantrypulse-db

# Run Alembic as an Argo CD Sync hook (re-created on every sync) instead of a
# Job per Helm revision. It retries until Postgres accepts connections.
migrations:
  argocdHook: true
